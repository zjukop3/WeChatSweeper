[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-sweeper"
version = "1.0.0"
description = "🧹 跨平台微信/企业微信缓存清理终端工具 — 自动检测账号，按类型/时间清理图片、视频、文件，安全移入回收站。Cross-platform WeChat & WeCom cache cleaner."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "WeChatSweeper" },
]
keywords = [
    "wechat",
    "weixin",
    "wecom",
    "微信",
    "企业微信",
    "cache",
    "cleaner",
    "cleanup",
    "disk",
    "storage",
    "cli",
    "tui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "click>=8.1.0",
    "send2trash>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/zjukop3/WeChatSweeper"
Repository = "https://github.com/zjukop3/WeChatSweeper"
Issues = "https://github.com/zjukop3/WeChatSweeper/issues"
"Changelog" = "https://github.com/zjukop3/WeChatSweeper/releases"

[project.scripts]
wechat-sweeper = "wechat_sweeper.cli:main"
wxs = "wechat_sweeper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wechat_sweeper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
